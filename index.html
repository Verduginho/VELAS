<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catálogo de Tortas | Velas</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="hero">
      <h1>Catálogo de Tortas</h1>
      <p>Conoce nuestras tortas disponibles.</p>
      <nav class="top-nav">
        <a href="index.html" aria-current="page">Catálogo</a>
        <a href="admin.html">Administración</a>
      </nav>
    </header>

    <main class="layout layout-catalog">
      <section>
        <h2>Tortas disponibles</h2>
        <div id="catalog" class="catalog-grid" aria-live="polite"></div>
      </section>
    </main>

    <template id="cake-card-template">
      <article class="cake-card">
        <img alt="" loading="lazy" />
        <div class="cake-content">
          <h3></h3>
          <p class="description"></p>
          <p class="price"></p>
        </div>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
